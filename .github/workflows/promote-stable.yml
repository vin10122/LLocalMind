name: Promote stable release

on:
  push:
    branches: [master]
    paths: ['.github/stable-release.json', '.github/workflows/promote-stable.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate existing Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, time
          from pathlib import Path
          tag = json.loads(Path('.github/stable-release.json').read_text())['tag']
          assert re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag), 'Stable semver required'
          # A requested tag may still be packaging/uploading its verified build.
          # Wait briefly for all four assets; never promote an incomplete release.
          for attempt in range(30):
              response = subprocess.run(['gh', 'release', 'view', tag, '--json', 'isDraft,tagName,assets,body'],capture_output=True,text=True)
              release = json.loads(response.stdout) if response.returncode == 0 else None
              version = tag[1:]
              expected = {f'LLocalMind-Setup-{version}-windows-x64.exe', f'LLocalMind-{version}-windows-x64-portable.zip'}
              expected |= {name+'.sha256' for name in list(expected)}
              if release and not release['isDraft'] and expected <= {a['name'] for a in release['assets'] if a['size']>0}:break
              if attempt==29:raise RuntimeError(f'Verified release assets are not ready for {tag}')
              time.sleep(10)
          assert not release['isDraft'] and release['tagName'] == tag
          version = tag[1:]
          names = {a['name'] for a in release['assets'] if a['size'] > 0}
          for asset in (f'LLocalMind-Setup-{version}-windows-x64.exe', f'LLocalMind-{version}-windows-x64-portable.zip'):
              assert {asset, asset + '.sha256'} <= names, f'Missing release asset: {asset}'
          notes = release['body'].replace('Windows preview of LLocalMind.', 'Stable Windows release of LLocalMind.')
          notes = notes.replace('This preview is not code-signed and is not offered by the stable auto-updater until promoted to a stable release.', 'This release is not code-signed. It is available through the stable update channel.')
          Path('stable-notes.md').write_text(notes)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'RELEASE_TAG={tag}\n')
          PY
      - name: Promote and verify updater discovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: src
        run: |
          title="LLocalMind $RELEASE_TAG"
          if [ "$RELEASE_TAG" = "v0.2.1" ]; then title="$title - International"; fi
          if [ "$RELEASE_TAG" = "v0.2.3" ]; then title="$title - Italian Interface"; fi
          if [ "$RELEASE_TAG" = "v0.2.5" ]; then title="$title - Vision image modes"; fi
          if [ "$RELEASE_TAG" = "v0.2.6" ]; then title="$title - Web search fixes"; fi
          if [ "$RELEASE_TAG" = "v0.2.8" ]; then title="$title - Tavily API key"; fi
          if [ "$RELEASE_TAG" = "v0.2.9" ]; then title="$title - Resilient updater"; fi
          gh release edit "$RELEASE_TAG" --prerelease=false --latest --title "$title" --notes-file stable-notes.md
          python .github/scripts/publish_update_feed.py
          python - <<'PY'
          import os
          import json, subprocess
          from llocalmind.updater import UpdateManager, version_tuple
          target = json.loads(subprocess.check_output(['gh','release','view',os.environ['RELEASE_TAG'],'--json','isPrerelease,isDraft']))
          assert not target['isPrerelease'] and not target['isDraft']
          # Authenticate CI's real API transport to avoid the shared runner's
          # anonymous quota. The desktop client remains anonymous; its actual
          # release-selection and asset-validation code runs unchanged here.
          import io
          from llocalmind.updater import API_URL
          def release_api(request, timeout):
              assert request.full_url == API_URL, 'Unexpected CI API destination'
              return io.BytesIO(subprocess.check_output(['gh','api',API_URL]))
          try:
              release = UpdateManager(current_version='0.1.0',opener=release_api).check()
              assert release is not None and version_tuple(release.version) >= version_tuple(os.environ['RELEASE_TAG']), 'Updater did not discover the promoted release or a newer version'
              print(f'Updater verified: {release.tag}, {release.asset_name}')
          except Exception as error:
              message = str(error).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::error title=Stable updater verification::{type(error).__name__}: {message}')
              raise
          PY
      - name: Record verified release outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROMOTION_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          repo = os.environ['GH_REPO']
          def api(path):
              response = subprocess.run(['gh','api',f'repos/{repo}/{path}'],capture_output=True,text=True)
              return json.loads(response.stdout) if response.returncode == 0 else None
          tag = json.loads(Path('.github/stable-release.json').read_text())['tag']
          receipt = dict(tag=tag, promotion=os.environ['PROMOTION_STATUS'], run_id=os.environ['GITHUB_RUN_ID'])
          release = api(f'releases/tags/{tag}')
          if release:
              receipt['release'] = dict(url=release['html_url'], draft=release['draft'], prerelease=release['prerelease'],
                  assets=[dict(name=a['name'],size=a['size']) for a in release['assets']])
          ref = api(f'git/ref/tags/{tag}')
          if ref:
              runs = api(f'actions/runs?head_sha={ref["object"]["sha"]}&per_page=10') or {}
              receipt['builds'] = []
              for run in runs.get('workflow_runs',[]):
                  if run['path'] != '.github/workflows/windows-release.yml':continue
                  row = {k:run[k] for k in ('id','head_sha','status','conclusion','html_url')}
                  jobs = api(f'actions/runs/{run["id"]}/jobs') or {}
                  row['jobs'] = [dict(name=j['name'],conclusion=j['conclusion'],
                      failed_steps=[s['name'] for s in j.get('steps',[]) if s['conclusion']=='failure']) for j in jobs.get('jobs',[])]
                  receipt['builds'].append(row)
          path = '.github/stable-release-result.json'
          previous = api(f'contents/{path}?ref=master')
          request = dict(message=f'Record {tag} release verification outcome',branch='master',
              content=base64.b64encode((json.dumps(receipt,indent=2)+'\n').encode()).decode())
          if previous:request['sha']=previous['sha']
          subprocess.run(['gh','api','--method','PUT',f'repos/{repo}/contents/{path}','--input','-'],
              input=json.dumps(request).encode(),stdout=subprocess.DEVNULL,check=True)
          print(json.dumps(receipt,indent=2))
          PY
