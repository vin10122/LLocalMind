name: Build LLocalMind for Windows

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - '.github/workflows/windows-release.yml'
      - '.github/scripts/**'
      - 'gui.py'
      - 'chat.py'
      - 'src/**'
      - 'cpp/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'requirements*.txt'
      - 'tools/**'
      - 'test/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-gui.txt
            requirements-build.txt
      - name: Verify application version
        shell: pwsh
        run: |
          $version = python -c "import sys;sys.path.insert(0,'src');from llocalmind import __version__;print(__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Cannot read application version" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match application version v$version"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build native kernels
        shell: pwsh
        run: |
          & .\scripts\compile_dequant_k.bat
          if ($LASTEXITCODE -ne 0) { throw "Weight conversion build failed" }
          & .\scripts\compile_native_expert.bat
          if ($LASTEXITCODE -ne 0) { throw "Native decode build failed" }
      - name: Run source tests
        shell: pwsh
        run: .\test\run_source_tests.ps1
      - name: Restore pinned vision runtime
        id: vision-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/LLocalMind-test-vision-runtime
          key: windows-x64-vision-${{ hashFiles('src/llocalmind/vision_runtime.py') }}
      - name: Verify actual Windows vision runtime
        shell: pwsh
        run: |
          if ('${{ steps.vision-runtime-cache.outputs.cache-hit }}' -ne 'true') {
            $url = python -c "import sys;sys.path.insert(0,'src');from llocalmind.vision_runtime import PACKAGE;print(PACKAGE.url)"
            if ($LASTEXITCODE -ne 0) { throw "Cannot read pinned runtime URL" }
            $archive = Join-Path $env:RUNNER_TEMP 'vision-runtime.zip'
            & curl.exe --fail --location --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 5 --max-time 120 --output $archive $url
            if ($LASTEXITCODE -ne 0) { Write-Output '::error title=Vision runtime download::Official pinned archive download failed'; throw "Runtime download failed" }
            $env:LLOCALMIND_TEST_RUNTIME_ARCHIVE = $archive
          }
          python test/probe_vision_runtime.py
          if ($LASTEXITCODE -ne 0) { throw "Vision runtime verification failed" }
      - name: Cache verified vision runtime
        if: steps.vision-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/LLocalMind-test-vision-runtime
          key: windows-x64-vision-${{ hashFiles('src/llocalmind/vision_runtime.py') }}
      - name: Build portable application
        shell: pwsh
        run: .\scripts\build_desktop.ps1
      - name: Test packaged EXE
        shell: pwsh
        run: |
          & .\dist\LLocalMind\LLocalMind-Diagnostics.exe --benchmark-vision --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged vision benchmark unavailable" }
          .\test\smoke_windows.ps1 -Executable .\dist\LLocalMind\LLocalMind-Diagnostics.exe -Report .\build\diagnostic-smoke.json -Screenshot .\build\diagnostic-gui.png -Language en -ItalianInterface
          .\test\smoke_windows.ps1 -Executable .\dist\LLocalMind\LLocalMind.exe -Report .\build\portable-smoke.json -Screenshot .\build\portable-gui.png
      - name: Install current Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe")
          $compiler = Get-ChildItem $candidates | Select-Object -First 1
          if (-not $compiler) { throw "ISCC.exe not found" }
          $output = python tools/build_windows_installer.py --app-dir .\dist\LLocalMind --iscc $compiler.FullName 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $details = ($output | Out-String)
            if ($details.Length -gt 6000) { $details = $details.Substring($details.Length - 6000) }
            $message = $details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows installer compiler::$message"
            throw "Installer build failed"
          }
      - name: Test installed application
        shell: pwsh
        run: |
          $setup = ".\dist\releases\LLocalMind-Setup-$env:APP_VERSION-windows-x64.exe"
          $install = Join-Path $env:RUNNER_TEMP 'LLocalMind-installed'
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$install`"") -PassThru
          $null = $process.Handle
          if (-not $process.WaitForExit(180000)) { Stop-Process -Id $process.Id -Force; throw "Installer timeout" }
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          .\test\smoke_windows.ps1 -Executable "$install\LLocalMind.exe" -Report .\build\installed-smoke.json -Screenshot .\build\installed-gui.png
      - name: Create portable ZIP and checksums
        shell: pwsh
        run: |
          $zip = ".\dist\releases\LLocalMind-$env:APP_VERSION-windows-x64-portable.zip"
          Compress-Archive -Path .\dist\LLocalMind -DestinationPath $zip -CompressionLevel Optimal
          Get-ChildItem .\dist\releases -File | Where-Object { $_.Extension -in @('.exe','.zip') } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content ($_.FullName + '.sha256') -Encoding ascii
          }
      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: LLocalMind-Windows-x64
          path: dist/releases/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-smoke-diagnostics
          path: |
            build/*smoke.json
            build/*gui.png
            build/*smoke.json.*.log
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LLocalMind-Windows-x64
          path: release
      - name: Publish Windows preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          LLocalMind 0.3.3 - Experimental Intelligent UI.

          - Optional response cards, comparison tables and checklists. Enable Settings → Intelligent UI · experimental → Response widgets. Disabled by default.
          - Both engines and Italian/English modes support the compact response format. Light and dark themes use native Qt controls; model output cannot execute code or trigger actions.
          - Copy exports readable text. Checklist checks are temporary and reset on reopening. Malformed or truncated widget responses remain ordinary text.
          - Previous widget answers are passed to the model as readable fallback text. Enabling the feature adds instructions to the prompt; actual model compliance and target-PC performance still require testing.
          - Component validation, rendering, streaming, settings and regression checks run before packaging. This is an experimental feature, not a general-purpose agent interface.

          Download the Setup EXE, or extract the entire portable ZIP. Models remain external. Existing chats, settings and .env survive updates. This build is unsigned.
          NOTES
          gh release create "$RELEASE_TAG" release/* --repo "$GH_REPO" --verify-tag --prerelease --title "LLocalMind $RELEASE_TAG - Experimental Intelligent UI" --notes-file release-notes.md
      - name: Publish official updater fallback feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/publish_update_feed.py
      - name: Record published Windows package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import base64, json, os, subprocess
          repo, tag = os.environ['GH_REPO'], os.environ['RELEASE_TAG']
          data = json.loads(subprocess.check_output(['gh','release','view',tag,'--json','tagName,isDraft,isPrerelease,assets,url']))
          assert data['tagName'] == tag and not data['isDraft']
          version = tag[1:]
          expected = {f'LLocalMind-Setup-{version}-windows-x64.exe', f'LLocalMind-{version}-windows-x64-portable.zip'}
          expected |= {name+'.sha256' for name in list(expected)}
          assert expected <= {a['name'] for a in data['assets'] if a['size'] > 0}
          data.update(source_commit=os.environ['GITHUB_SHA'], build_run=os.environ['GITHUB_RUN_ID'])
          path = '.github/windows-release-result.json'
          previous = subprocess.run(['gh','api',f'repos/{repo}/contents/{path}?ref=master'],capture_output=True,text=True)
          request = dict(message=f'Record verified Windows package {tag}',branch='master',
              content=base64.b64encode((json.dumps(data,indent=2)+'\n').encode()).decode())
          if previous.returncode == 0:request['sha'] = json.loads(previous.stdout)['sha']
          subprocess.run(['gh','api','--method','PUT',f'repos/{repo}/contents/{path}','--input','-'],
              input=json.dumps(request).encode(),stdout=subprocess.DEVNULL,check=True)
          print(f'Verified release and all four package assets: {tag}')
          PY
