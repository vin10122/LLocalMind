name: Build LLocalMind for Windows

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - '.github/workflows/windows-release.yml'
      - 'gui.py'
      - 'chat.py'
      - 'src/**'
      - 'cpp/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'requirements*.txt'
      - 'tools/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-gui.txt
            requirements-build.txt
      - name: Verify application version
        shell: pwsh
        run: |
          $version = python -c "import sys;sys.path.insert(0,'src');from llocalmind import __version__;print(__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Cannot read application version" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match application version v$version"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build native kernels
        shell: pwsh
        run: |
          & .\scripts\compile_dequant_k.bat
          if ($LASTEXITCODE -ne 0) { throw "Weight conversion build failed" }
          & .\scripts\compile_native_expert.bat
          if ($LASTEXITCODE -ne 0) { throw "Native decode build failed" }
      - name: Run source tests
        shell: pwsh
        run: .\tools\run_source_tests.ps1
      - name: Verify actual Windows vision runtime
        run: python tools/probe_vision_runtime.py
      - name: Build portable application
        shell: pwsh
        run: .\scripts\build_desktop.ps1
      - name: Test packaged EXE
        shell: pwsh
        run: |
          & .\dist\LLocalMind\LLocalMind-Diagnostics.exe --benchmark-vision --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged vision benchmark unavailable" }
          .\tools\smoke_windows.ps1 -Executable .\dist\LLocalMind\LLocalMind-Diagnostics.exe -Report .\build\diagnostic-smoke.json -Screenshot .\build\diagnostic-gui.png
          .\tools\smoke_windows.ps1 -Executable .\dist\LLocalMind\LLocalMind.exe -Report .\build\portable-smoke.json -Screenshot .\build\portable-gui.png
      - name: Install current Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe")
          $compiler = Get-ChildItem $candidates | Select-Object -First 1
          if (-not $compiler) { throw "ISCC.exe not found" }
          $output = python tools/build_windows_installer.py --app-dir .\dist\LLocalMind --iscc $compiler.FullName 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $details = ($output | Out-String)
            if ($details.Length -gt 6000) { $details = $details.Substring($details.Length - 6000) }
            $message = $details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows installer compiler::$message"
            throw "Installer build failed"
          }
      - name: Test installed application
        shell: pwsh
        run: |
          $setup = ".\dist\releases\LLocalMind-Setup-$env:APP_VERSION-windows-x64.exe"
          $install = Join-Path $env:RUNNER_TEMP 'LLocalMind-installed'
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$install`"") -PassThru
          $null = $process.Handle
          if (-not $process.WaitForExit(180000)) { Stop-Process -Id $process.Id -Force; throw "Installer timeout" }
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          .\tools\smoke_windows.ps1 -Executable "$install\LLocalMind.exe" -Report .\build\installed-smoke.json -Screenshot .\build\installed-gui.png
      - name: Create portable ZIP and checksums
        shell: pwsh
        run: |
          $zip = ".\dist\releases\LLocalMind-$env:APP_VERSION-windows-x64-portable.zip"
          Compress-Archive -Path .\dist\LLocalMind -DestinationPath $zip -CompressionLevel Optimal
          Get-ChildItem .\dist\releases -File | Where-Object { $_.Extension -in @('.exe','.zip') } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content ($_.FullName + '.sha256') -Encoding ascii
          }
      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: LLocalMind-Windows-x64
          path: dist/releases/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-smoke-diagnostics
          path: |
            build/*smoke.json
            build/*gui.png
            build/*smoke.json.*.log
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LLocalMind-Windows-x64
          path: release
      - name: Publish Windows preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          Windows preview of LLocalMind.

          - Installer: download `LLocalMind-Setup-*-windows-x64.exe`.
          - Portable: extract the whole portable ZIP, then open `LLocalMind/LLocalMind.exe`.
          - No Python installation is required. GGUF models are external and are not included.
          - Each generated answer shows its token count and measured decode speed; these metrics are saved with conversations.
          - New: optional Vulkan GPU image encoder with device detection and CPU fallback; language-model layers remain on CPU. Existing CPU-runtime users must click Settings → Installa / aggiorna motore vision Vulkan once after updating the app.
          - The header and local report identify the selected encoder. Visual-token detail settings are unchanged. GPU arithmetic, driver support and shared-memory pressure require target-PC validation; no new vision latency is claimed.
          - New: bounded visual-token/batch/cache defaults, image/prefix reuse, lazy vision imports and engine-specific reloads. Advanced settings expose the speed/detail tradeoff.
          - New: native long-prompt shared-expert batching, reusable KV storage and coalesced GUI streaming.
          - New: local load/request reports and `LLocalMind-Diagnostics.exe --benchmark-vision --image PATH` (close the GUI first). No target-PC vision speed is claimed.
          - New: Settings → Installa motore vision downloads, verifies and configures the official Windows Vulkan llama.cpp runtime automatically, without administrator rights.
          - The updater now includes public preview releases, selects the highest newer numeric version, and continues to exclude drafts and verify installer SHA-256. Older stable-only apps need this preview installer run manually once.
          - The runtime is pinned to b12110 with a verified SHA-256; cancellation cleans temporary files and existing installations are preserved.
          - New: local image attachments in the GUI and CLI, with persistent image history and a local llama.cpp vision engine.
          - Vision requires a language-model GGUF and matching mmproj GGUF. The app can install llama-server on demand; runtime and model files are not bundled. The optimized OpenVINO engine remains text-only.
          - Fixed Windows Python launcher arguments and batch quoting; removed the invalid RGB-average projector.
          - Vision transport, cancellation, installer syntax and GUI behavior are tested automatically. CI also installs the real pinned runtime and probes it from source, the packaged EXE and the installed app. Actual Hermes/mmproj compatibility, image-answer quality and vision performance still need validation on the target PC.
          - Updates use the current vin10122/LLocalMind repository; older previews can be upgraded by running this installer without uninstalling first.
          - Choose your compatible GGUF in Settings. Intel GPU/NPU support requires appropriate drivers.
          - CI checks the GUI, CPU OpenVINO, native kernels and installer without a GGUF. Full-model quality/performance on the target PC still needs manual validation.
          - SHA-256 sidecars are included. This preview is not code-signed. Updaters since v0.1.5 include public previews; older stable-only apps require manual installation.
          NOTES
          gh release create "$RELEASE_TAG" release/* --repo "$GH_REPO" --verify-tag --prerelease --title "LLocalMind $RELEASE_TAG - Windows preview" --notes-file release-notes.md
